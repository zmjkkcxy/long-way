<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; background: #0b1218; }
  body {
    margin: 0; background: #0b1218; color: #fffcf3;
    font-family: "Cormorant Garamond", "Noto Serif SC", serif;
    overflow-x: clip;
  }

  .journey { position: relative; height: 1200vh; }

  .stage {
    position: sticky; top: 0;
    height: 100vh;
    height: 100svh;
    overflow: hidden;
    background: #0a1016;
    perspective: 1200px;
    perspective-origin: 50% 58%;
    isolation: isolate;
  }

  .world { position: absolute; inset: 0; transform-style: preserve-3d; will-change: transform; }

  .scene { position: absolute; inset: 0; transform-style: preserve-3d; will-change: opacity; }

  .band {
    position: absolute; left: 0; top: 0;
    width: 100%; height: auto;
    min-height: 100%;
    object-fit: cover;
    object-position: 50% 0%;
    transform-origin: 50% 0%;
    backface-visibility: hidden;
    will-change: transform;
    user-select: none; -webkit-user-drag: none; pointer-events: none;
  }

  /* act 0 is a flat 2D pan — no depth slices, no 3D */
  .flat {
    position: absolute; left: 0; top: 0;
    width: 100%; height: auto;
    object-position: 50% 0%;
    backface-visibility: hidden;
    will-change: transform;
    user-select: none; -webkit-user-drag: none; pointer-events: none;
  }

  /* ---------- atmosphere ---------- */
  .mist {
    position: absolute; inset: 0; z-index: 18; pointer-events: none;
    opacity: 0;
    background:
      radial-gradient(120% 55% at 50% 92%, rgba(255,244,224,.42) 0%, rgba(255,240,215,.16) 38%, transparent 70%),
      radial-gradient(90% 40% at 18% 78%, rgba(226,236,245,.20) 0%, transparent 62%);
    mix-blend-mode: screen;
    filter: blur(8px);
    will-change: opacity, transform;
  }

  .shaft {
    position: absolute; inset: 0; z-index: 19; pointer-events: none;
    opacity: 0;
    background: radial-gradient(circle at 24% 6%, rgba(255,238,196,.30) 0%, rgba(255,234,180,.10) 26%, transparent 52%);
    mix-blend-mode: screen;
    will-change: opacity;
  }

  .vignette {
    position: absolute; inset: 0; z-index: 20; pointer-events: none;
    background:
      radial-gradient(115% 78% at 50% 12%, transparent 42%, rgba(6,16,26,.44) 100%),
      linear-gradient(180deg, rgba(6,18,28,.46) 0%, transparent 24%, transparent 74%, rgba(6,18,28,.56) 100%);
  }

  .flash {
    position: absolute; inset: 0; z-index: 22; pointer-events: none; opacity: 0;
    background: radial-gradient(circle at 50% 54%,
      rgba(255,253,244,.95) 0%, rgba(255,246,222,.62) 22%,
      rgba(255,236,200,.22) 44%, rgba(255,236,200,0) 68%);
    mix-blend-mode: screen;
  }

  .veil {
    position: absolute; inset: 0; z-index: 25;
    pointer-events: none; opacity: 0;
    background: #08101a;
  }

  /* film grain disabled — it read as extra darkening on the paintings */
  .grain { display: none; }

  .bar {
    position: fixed; left: 0; right: 0; height: 4vh;
    background: #060b11; z-index: 55; pointer-events: none;
    transition: opacity .6s ease;
  }
  .bar-top { top: 0; }
  .bar-bottom { bottom: 0; }

  .copy {
    position: absolute; left: 0; right: 0; z-index: 30; padding: 0 24px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    pointer-events: none; will-change: transform, opacity;
  }
  .copy .kicker {
    font-family: "Noto Serif SC", serif; font-size: clamp(.6rem, 1.05vw, .76rem);
    letter-spacing: .5em; text-transform: uppercase;
    color: rgba(255,252,243,.75); margin-bottom: 1em;
    text-shadow: 0 2px 14px rgba(20,50,80,.85);
  }
  .copy h1 {
    font-family: "Cormorant Garamond", serif; font-weight: 500;
    font-size: clamp(2.4rem, 10vw, 9rem); line-height: .86; letter-spacing: .08em;
    text-shadow: 0 10px 60px rgba(20,55,90,.85), 0 2px 5px rgba(30,70,100,.6);
  }
  .copy h2 {
    font-family: "Cormorant Garamond", "Noto Serif SC", serif; font-weight: 500;
    font-size: clamp(1.4rem, 3.4vw, 2.9rem); line-height: 1.28; letter-spacing: .04em;
    text-shadow: 0 6px 34px rgba(10,35,60,.95);
  }
  .copy p {
    max-width: 28em; margin-top: 1.05em;
    font-family: "Noto Serif SC", serif;
    font-size: clamp(.82rem, 1.2vw, 1rem); line-height: 1.95; letter-spacing: .06em;
    color: rgba(255,252,243,.95);
    text-shadow: 0 2px 18px rgba(6,30,55,.98);
  }

  .c0 { bottom: 13vh; }
  .c0 .word {
    font-family: "Noto Serif SC", serif; font-weight: 300;
    font-size: clamp(1rem, 2.4vw, 1.9rem);
    letter-spacing: 1em; text-indent: 1em;
    color: rgba(255,250,240,.9);
    text-shadow: 0 4px 30px rgba(6,20,40,.95);
  }

  .c1 { top: 8vh; }
  .c2, .c3, .c4, .c5 { top: 50%; transform: translateY(-50%); }
  .copy .name { color: #ffe9b8; letter-spacing: .12em; }
  .copy .sign {
    margin-top: 2em;
    font-family: "Cormorant Garamond", "Noto Serif SC", serif;
    font-style: italic;
    font-size: clamp(.86rem, 1.15vw, 1.02rem);
    letter-spacing: .3em;
    color: rgba(255,242,214,.72);
    text-shadow: 0 2px 16px rgba(6,30,55,.9);
  }
  #c5a, #c5b, #c5c { opacity: 0; will-change: opacity, transform; }

  .rail {
    position: fixed; right: 22px; top: 50%; transform: translateY(-50%);
    width: 2px; height: 160px; background: rgba(255,252,243,.16);
    border-radius: 2px; z-index: 60; cursor: ns-resize;
    touch-action: none;
  }
  .rail::before { content: ""; position: absolute; inset: -14px -12px; }
  .rail i {
    position: absolute; top: 0; left: 0; width: 100%; height: 0%;
    background: rgba(255,252,243,.9); border-radius: 2px;
  }
  .rail b {
    position: absolute; left: -3px; width: 8px; height: 1px;
    background: rgba(255,252,243,.45);
  }

  .playBtn {
    position: fixed; right: 34px; bottom: calc(4vh + 22px); z-index: 62;
    width: 48px; height: 48px;
    border: 1px solid rgba(255,252,243,.28);
    border-radius: 999px;
    background: rgba(10,18,26,.62);
    backdrop-filter: blur(10px);
    color: rgba(255,252,243,.95);
    font-size: 13px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    box-shadow: 0 6px 22px rgba(0,0,0,.38);
    transition: background .25s ease, transform .25s ease, border-color .25s ease;
  }
  .playBtn:hover {
    background: rgba(255,252,243,.16);
    border-color: rgba(255,252,243,.55);
    transform: scale(1.07);
  }

  .hint {
    position: fixed; left: 50%; bottom: calc(4vh + 26px); transform: translateX(-50%);
    font-family: "Noto Serif SC", serif; font-size: .72rem; letter-spacing: .4em;
    color: rgba(255,252,243,.55); z-index: 60; transition: opacity .5s ease;
    animation: bob 2.6s ease-in-out infinite;
  }
  @keyframes bob {
    0%,100% { transform: translate(-50%, 0); }
    50%     { transform: translate(-50%, 7px); }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .hint { animation: none; }
    .mist { filter: none; }
  }
  @media (max-height: 600px) { .bar { height: 2.5vh; } }
</style>

<body>

<section class="journey" id="journey">
  <div class="stage" id="stage">
    <div class="world" id="world">

      <!-- ACT 0 — the colossus, a flat 2D pan (no depth slices) -->
      <div class="scene" id="scene0">
        <img class="flat" id="flat0" src="assets/colossus/band-0.webp"
             alt="" fetchpriority="high" />
      </div>

      <!-- ACT 1 — the griffin gate -->
      <div class="scene" id="scene1">
        <img class="band" data-src="assets/griffin/band-0.webp" data-z="-1040" alt="" decoding="async" />
        <img class="band" data-src="assets/griffin/band-1.webp" data-z="-760"  alt="" decoding="async" />
        <img class="band" data-src="assets/griffin/band-2.webp" data-z="-500"  alt="" decoding="async" />
        <img class="band" data-src="assets/griffin/band-3.webp" data-z="-260"  alt="" decoding="async" />
        <img class="band" data-src="assets/griffin/band-4.webp" data-z="-40"   alt="" decoding="async" />
      </div>

      <!-- ACT 2 — the sinkhole town -->
      <div class="scene" id="scene2">
        <img class="band" data-src="assets/sinkhole/band-0.webp" data-z="-1040" alt="" decoding="async" />
        <img class="band" data-src="assets/sinkhole/band-1.webp" data-z="-760"  alt="" decoding="async" />
        <img class="band" data-src="assets/sinkhole/band-2.webp" data-z="-500"  alt="" decoding="async" />
        <img class="band" data-src="assets/sinkhole/band-3.webp" data-z="-260"  alt="" decoding="async" />
        <img class="band" data-src="assets/sinkhole/band-4.webp" data-z="-40"   alt="" decoding="async" />
      </div>

      <!-- ACT 3 — the stonefall city -->
      <div class="scene" id="scene3">
        <img class="band" data-src="assets/shrine/band-0.webp" data-z="-1040" alt="" decoding="async" />
        <img class="band" data-src="assets/shrine/band-1.webp" data-z="-760"  alt="" decoding="async" />
        <img class="band" data-src="assets/shrine/band-2.webp" data-z="-500"  alt="" decoding="async" />
        <img class="band" data-src="assets/shrine/band-3.webp" data-z="-260"  alt="" decoding="async" />
        <img class="band" data-src="assets/shrine/band-4.webp" data-z="-40"   alt="" decoding="async" />
      </div>

    </div>

    <div class="mist" id="mist"></div>
    <div class="shaft" id="shaft"></div>
    <div class="flash" id="flash"></div>
    <div class="veil" id="veil"></div>
    <div class="vignette" id="vignette"></div>

    <div class="copy c0" id="c0">
      <div class="word">仰 望</div>
    </div>

    <div class="copy c1" id="c1">
      <div class="kicker">门</div>
      <h1>THE LONG WAY</h1>
    </div>

    <div class="copy c2" id="c2">
      <h2>有些门开在天上。</h2>
      <p>认了路的人，不问为什么。</p>
    </div>

    <div class="copy c3" id="c3">
      <h2>城一层压着一层，<br />压进地底。</h2>
      <p>住得高的人，听不见下面的声音。</p>
    </div>

    <div class="copy c4" id="c4">
      <h2>河走到这里就不走了，<br />石头替它站着。</h2>
      <p>城长在石头上，像一句没说完的话。</p>
    </div>

    <div class="copy c5" id="c5">
      <h2 id="c5a">路还长。</h2>
      <p id="c5b">愿风替你开门，愿你在无人处仍有火。</p>
      <p class="sign" id="c5c">—— 生日快乐，<span class="name">名字</span></p>
    </div>

  </div>
</section>

<div class="bar bar-top" id="barTop"></div>
<div class="bar bar-bottom" id="barBottom"></div>

<div class="rail" id="rail" role="slider" tabindex="0" aria-label="滚动进度"
     aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <i id="railFill"></i>
  <b style="top:22%"></b>
  <b style="top:52%"></b>
  <b style="top:80%"></b>
</div>

<button class="playBtn" id="playBtn" aria-label="播放 / 暂停">▶</button>
<div class="hint" id="hint">向 下 滚 动</div>

<script>
(() => {
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  const journey = document.getElementById('journey');
  const world   = document.getElementById('world');
  const scene0  = document.getElementById('scene0');
  const scene1  = document.getElementById('scene1');
  const scene2  = document.getElementById('scene2');
  const scene3  = document.getElementById('scene3');
  const flat0   = document.getElementById('flat0');
  const mist    = document.getElementById('mist');
  const shaft   = document.getElementById('shaft');
  const flash   = document.getElementById('flash');
  const veil    = document.getElementById('veil');
  const vignette= document.getElementById('vignette');
  const rail    = document.getElementById('rail');
  const railFill= document.getElementById('railFill');
  const playBtn = document.getElementById('playBtn');
  const hint    = document.getElementById('hint');
  const barTop  = document.getElementById('barTop');
  const barBottom = document.getElementById('barBottom');
  const c0 = document.getElementById('c0');
  const c1 = document.getElementById('c1');
  const c2 = document.getElementById('c2');
  const c3 = document.getElementById('c3');
  const c4 = document.getElementById('c4');
  const c5 = document.getElementById('c5');
  const c5a = document.getElementById('c5a');
  const c5b = document.getElementById('c5b');
  const c5c = document.getElementById('c5c');

  const bands1 = [...scene1.querySelectorAll('.band')];
  const bands2 = [...scene2.querySelectorAll('.band')];
  const bands3 = [...scene3.querySelectorAll('.band')];

  const CAM = 1150;
  const S1 = 0.22, S2 = 0.52, S3 = 0.80;
  const SWITCH = S2;

  let total = 0, target = 0, current = 0, raf = null, finaleT0 = 0;
  let preloaded = false;

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');

  const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
  const smoothstep = (e0, e1, v) => {
    const x = clamp((v - e0) / (e1 - e0));
    return x * x * (3 - 2 * x);
  };

  function measure() {
    total = Math.max(1, journey.offsetHeight - window.innerHeight);
  }
  measure();

  function flyScene(bands, localP, globalP, fadeStart, fadeOut) {
    const cam = localP * CAM;
    for (const b of bands) {
      const z0 = parseFloat(b.dataset.z);
      const z = z0 + cam;

      const approach = smoothstep(180, 900, z);
      const blur = approach * 6.5;
      const dim  = 1 - approach * 0.2;

      const near = clamp((z0 + 1100) / 1100);
      const opLeave = 1 - approach;
      const opSchedule = 1 - smoothstep(
        fadeStart + near * 0.10,
        fadeStart + near * 0.10 + 0.16,
        globalP
      ) * (1 - fadeOut);

      b.style.transform = `translate3d(0, 0, ${z.toFixed(1)}px)`;
      if (blur > 0.05) {
        b.style.filter = `blur(${blur.toFixed(2)}px) brightness(${dim.toFixed(3)})`;
      } else if (b.style.filter) {
        b.style.filter = '';
      }
      b.style.opacity = clamp(Math.min(opLeave, opSchedule), 0, 1).toFixed(3);
    }
  }

  /* ---------------- autoplay ---------------- */
  const WP = [[0, 0], [0.22, 5000], [0.52, 12500], [0.80, 19000], [1, 25000]];
  const AUTO_MS = 25000;
  const SCROLL_GRACE_MS = 150;
  let auto = false, apTime = 0, lastT = 0, ignoreScrollUntil = 0, autoTargetY = -1;

  function pFromTime(t) {
    let i = 0;
    while (i < WP.length - 2 && t > WP[i + 1][1]) i++;
    const [p0, t0] = WP[i], [p1, t1] = WP[i + 1];
    return p0 + (p1 - p0) * smoothstep(0, t1 - t0, t - t0);
  }

  function startAuto() {
    if (reduceMotion.matches) {
      if (window.scrollY > 4) window.scrollTo({ top: 0, behavior: 'smooth' });
      return;
    }
    auto = true;
    apTime = clamp(window.scrollY / total) * AUTO_MS;
    lastT = performance.now();
    playBtn.textContent = '❚❚';
    hint.style.opacity = '0';
    kick();
  }

  function stopAuto() {
    if (!auto) return;
    auto = false;
    playBtn.textContent = current >= 0.999 ? '↻' : '▶';
  }

  playBtn.addEventListener('click', () => {
    if (auto) return stopAuto();
    if (target >= 0.999) {
      window.scrollTo({ top: 0, behavior: 'instant' });
      current = 0;
      setTimeout(startAuto, 120);
    } else {
      startAuto();
    }
  });

  window.addEventListener('wheel', stopAuto, { passive: true });
  window.addEventListener('touchstart', stopAuto, { passive: true });
  window.addEventListener('keydown', (e) => {
    if (e.key === ' ') { e.preventDefault(); auto ? stopAuto() : startAuto(); }
    else if (['ArrowDown','ArrowUp','PageDown','PageUp','Home','End'].includes(e.key)) stopAuto();
    else if (e.key === '1') stopAuto(), window.scrollTo({ top: 0, behavior: 'smooth' });
    else if (e.key === '2') stopAuto(), window.scrollTo({ top: total * SWITCH, behavior: 'smooth' });
    else if (e.key === '3') stopAuto(), window.scrollTo({ top: total * S3, behavior: 'smooth' });
  });
  window.addEventListener('scroll', () => {
    if (auto && Math.abs(window.scrollY - autoTargetY) <= 2) return;
    if (performance.now() < ignoreScrollUntil) return;
    stopAuto();
  }, { passive: true });

  /* ---------------- rail scrubbing ---------------- */
  let scrubbing = false;
  function scrubTo(clientY) {
    const r = rail.getBoundingClientRect();
    const p = clamp((clientY - r.top) / r.height);
    window.scrollTo({ top: total * p, behavior: 'instant' });
  }
  rail.addEventListener('pointerdown', (e) => {
    stopAuto(); scrubbing = true;
    rail.setPointerCapture(e.pointerId);
    scrubTo(e.clientY);
  });
  rail.addEventListener('pointermove', (e) => { if (scrubbing) scrubTo(e.clientY); });
  rail.addEventListener('pointerup', () => { scrubbing = false; });
  rail.addEventListener('pointercancel', () => { scrubbing = false; });

  /* ---------------- render ---------------- */
  function render(now) {
    raf = null;

    if (auto) {
      const dt = Math.min(50, (now || performance.now()) - lastT);
      lastT = now || performance.now();
      apTime += dt;
      ignoreScrollUntil = performance.now() + SCROLL_GRACE_MS;
      autoTargetY = Math.round(total * pFromTime(apTime));
      window.scrollTo({ top: autoTargetY, behavior: 'instant' });
      if (pFromTime(apTime) >= 1) stopAuto();
    }

    target = clamp(window.scrollY / total);

    if (reduceMotion.matches) {
      current = target;
    } else {
      current += (target - current) * (auto ? 0.2 : 0.11);
      if (Math.abs(current - target) <= 0.0003) current = target;
    }

    if (!preloaded && current > 0.12) {
      preloaded = true;
      [...bands1, ...bands2, ...bands3].forEach((b) => {
        if (b.dataset.src) b.src = b.dataset.src;
      });
    }

    const p = current;

    /* ---------- ACT 0 : bottom→top pan, like raising your eyes ---------- */
    {
      const pull = smoothstep(0, 1, clamp(p / S1));
      const s = 1.32 - 0.32 * pull;
      const bandH = flat0.offsetHeight || 1;
      const V = window.innerHeight;
      const T = (V - s * bandH) * (1 - pull);
      flat0.style.transform = `translate3d(0, ${T.toFixed(1)}px, 0) scale(${s.toFixed(4)})`;
      scene0.style.opacity = (p < S1 + 0.02 ? 1 : 0).toFixed(3);
      scene0.style.visibility = p > S1 + 0.04 ? 'hidden' : 'visible';

      mist.style.opacity = (0.85 - 0.45 * pull).toFixed(3);
      mist.style.transform = `translate3d(0, ${(-16 * pull).toFixed(1)}px, 0)`;
      shaft.style.opacity = (0.55 + 0.35 * pull).toFixed(3);
    }

    /* ---------- ACT 1 / 2 / 3 ---------- */
    const pA1 = p < 0.30 ? 0.72 : clamp(0.72 + 0.28 * (p - 0.30) / 0.22);
    flyScene(bands1, pA1, p, 0.44, 1);

    const pA2 = 0.72 * clamp((p - 0.58) / 0.22);
    flyScene(bands2, pA2, p, 2, 0);

    const pA3 = 0.72 * clamp((p - 0.80) / 0.20);
    flyScene(bands3, pA3, p, 2, 0);

    const is1 = p >= S1 && p < S2, is2 = p >= S2 && p < S3, is3 = p >= S3;
    scene1.style.opacity = is1 ? '1' : '0';
    scene2.style.opacity = is2 ? '1' : '0';
    scene3.style.opacity = is3 ? '1' : '0';

    scene1.style.visibility = (p < S1 - 0.02 || p > S2 + 0.02) ? 'hidden' : 'visible';
    scene2.style.visibility = (p < S2 - 0.02 || p > S3 + 0.02) ? 'hidden' : 'visible';
    scene3.style.visibility = p < S3 - 0.02 ? 'hidden' : 'visible';

    const blur1 = 3 * (1 - smoothstep(S1 - 0.040, S1, p));
    const blur2 = 3 * (1 - smoothstep(S2 - 0.040, S2, p));
    const blur3 = 3 * (1 - smoothstep(S3 - 0.040, S3, p));
    scene1.style.filter = blur1 > 0.1 ? `blur(${blur1.toFixed(2)}px)` : '';
    scene2.style.filter = blur2 > 0.1 ? `blur(${blur2.toFixed(2)}px)` : '';
    scene3.style.filter = blur3 > 0.1 ? `blur(${blur3.toFixed(2)}px)` : '';

    if (p >= S1) {
      mist.style.opacity = '0';
      shaft.style.opacity = (0.30 * (1 - smoothstep(S1, S1 + 0.10, p))).toFixed(3);
    }

    /* ---------- three seams ---------- */
    const veilAt = (s) => 0.94 * smoothstep(s - 0.050, s, p) *
                          (1 - smoothstep(s, s + 0.085, p));
    veil.style.opacity = Math.max(veilAt(S1), veilAt(S2), veilAt(S3)).toFixed(3);

    const flashAt = (s) => 0.25 * smoothstep(s - 0.02, s, p) *
                           (1 - smoothstep(s, s + 0.02, p));
    flash.style.opacity = Math.max(flashAt(S1), flashAt(S2), flashAt(S3)).toFixed(3);
    flash.style.visibility =
      (Math.abs(p - S1) < 0.03 || Math.abs(p - S2) < 0.03 || Math.abs(p - S3) < 0.03)
        ? 'visible' : 'hidden';

    vignette.style.opacity = (0.70 + 0.30 * smoothstep(0.44, 0.50, p)).toFixed(3);

    /* ---------- copy ---------- */
    const a0 = 1 - smoothstep(0.06, 0.15, p);
    const a1 = smoothstep(0.31, 0.38, p) * (1 - smoothstep(0.46, 0.50, p));
    const a2 = smoothstep(0.59, 0.66, p) * (1 - smoothstep(0.73, 0.78, p));
    const a3 = smoothstep(0.84, 0.88, p) * (1 - smoothstep(0.905, 0.935, p));
    const a4 = smoothstep(0.945, 0.975, p);

    c0.style.opacity = a0.toFixed(3);
    c0.style.transform = `translate3d(0, ${((1 - a0) * 30).toFixed(1)}px, 0)`;

    c1.style.opacity = a1.toFixed(3);
    c1.style.transform = `translate3d(0, calc(-50% + ${((1 - a1) * 34).toFixed(1)}px), 0)`;
    c2.style.opacity = a1.toFixed(3);
    c2.style.transform = `translate3d(0, calc(-50% + ${((1 - a1) * 34).toFixed(1)}px), 0)`;
    c3.style.opacity = a2.toFixed(3);
    c3.style.transform = `translate3d(0, calc(-50% + ${((1 - a2) * 36).toFixed(1)}px), 0)`;
    c4.style.opacity = a3.toFixed(3);
    c4.style.transform = `translate3d(0, calc(-50% + ${((1 - a3) * 36).toFixed(1)}px), 0)`;
    c5.style.opacity = a4.toFixed(3);
    c5.style.transform = `translate3d(0, calc(-50% + ${((1 - a4) * 40).toFixed(1)}px), 0)`;

    /* ---------- the finale, in beats ---------- */
    if (p > 0.86) {
      if (!finaleT0) finaleT0 = now || performance.now();
    } else {
      finaleT0 = 0;
    }
    const el = finaleT0 ? ((now || performance.now()) - finaleT0) : 0;
    const beat1 = smoothstep(150, 1000, el);
    const beat2 = smoothstep(1900, 2750, el);
    const beat3 = smoothstep(4200, 5200, el);

    c5a.style.opacity = beat1.toFixed(3);
    c5a.style.transform = `translate3d(0, ${((1 - beat1) * 18).toFixed(1)}px, 0)`;
    c5b.style.opacity = beat2.toFixed(3);
    c5b.style.transform = `translate3d(0, ${((1 - beat2) * 16).toFixed(1)}px, 0)`;
    c5c.style.opacity = beat3.toFixed(3);
    c5c.style.transform = `translate3d(0, ${((1 - beat3) * 14).toFixed(1)}px, 0)`;

    /* ---------- world dive, retimed for four acts ---------- */
    const diveScale = Math.min(1, Math.max(0.5,
      Math.min(window.innerWidth / 1440, window.innerHeight / 720)));
    const dive = (smoothstep(0.30, 0.62, p) * -440 +
                  smoothstep(0.78, 0.88, p) * -200) * diveScale;

    world.style.transform =
      `translate3d(0, ${dive.toFixed(1)}px, 0) ` +
      `rotateX(${(-cy * 1.0).toFixed(2)}deg) ` +
      `rotateY(${(cx * 1.5).toFixed(2)}deg)`;

    /* ---------- chrome ---------- */
    railFill.style.height = (p * 100).toFixed(1) + '%';
    rail.setAttribute('aria-valuenow', Math.round(p * 100));
    hint.style.opacity = (p > 0.025 || auto) ? '0' : '1';
    if (!auto) {
      if (p >= 0.999) playBtn.textContent = '↻';
      else if (playBtn.textContent !== '▶') playBtn.textContent = '▶';
    }
    const barO = 1 - smoothstep(0.55, 0.70, p);
    barTop.style.opacity = barO.toFixed(3);
    barBottom.style.opacity = barO.toFixed(3);

    if (auto || Math.abs(current - target) >= 0.0003 ||
        (finaleT0 && (performance.now() - finaleT0) < 5500)) {
      raf = requestAnimationFrame(render);
    }
  }

  const kick = () => { if (!raf) raf = requestAnimationFrame(render); };
  window.addEventListener('scroll', kick, { passive: true });
  window.addEventListener('resize', () => { measure(); kick(); }, { passive: true });
  window.addEventListener('orientationchange', () => { setTimeout(measure, 250); });

  let tx = 0, ty = 0, cx = 0, cy = 0, swayRaf = false;
  window.addEventListener('pointermove', (e) => {
    if (reduceMotion.matches || e.pointerType !== 'mouse') return;
    tx = (e.clientX / window.innerWidth - 0.5) * 2;
    ty = (e.clientY / window.innerHeight - 0.5) * 2;
    if (!swayRaf) { swayRaf = true; requestAnimationFrame(sway); }
  }, { passive: true });

  function sway() {
    cx += (tx - cx) * 0.07;
    cy += (ty - cy) * 0.07;
    kick();
    if (Math.abs(tx - cx) > 0.001 || Math.abs(ty - cy) > 0.001) requestAnimationFrame(sway);
    else swayRaf = false;
  }

  const qp = new URLSearchParams(location.search);
  const startP = parseFloat(qp.get('p') || '0');
  if (startP > 0) {
    window.scrollTo({ top: total * startP, behavior: 'instant' });
  }

  render();

  if (startP === 0 && window.scrollY < 4 && !reduceMotion.matches) {
    let seen = false;
    try { seen = localStorage.getItem('hw_seen') === '1'; } catch (_) {}
    setTimeout(() => {
      if (!auto && window.scrollY < 4) {
        startAuto();
        try { localStorage.setItem('hw_seen', '1'); } catch (_) {}
      }
    }, seen ? 700 : 1800);
  }
})();
</script>
</body>
</html>
